name: guard aim pauses the graph on overspend
description: >
  A cost guard (cost_usd <= 1) trips while an expensive worker reports usage. The server pauses
  the graph and escalates; the worker sees pauseRequested and releases with a handoff (not
  counted). The human raises the budget (a protected, human-only change), the graph resumes,
  and the work completes.
spec: |
  schema: agent-graphs/v1
  title: Guard pause
  slug: guard-pause
  aims:
    - key: budget
      title: Spend stays within budget
      metric: cost_usd
      source: derived
      comparator: lte
      target: 1
      unit: usd
      guard: true
  nodes:
    - key: research
      title: Research
      aim: Options compared
      purpose: Pick a library
      prompt: Compare the three candidate libraries.
      aims: ["Trade-offs are documented"]
    - key: build
      title: Build
      aim: Feature built
      purpose: The deliverable
      needs: [research]
      prompt: Build it.
      aims:
        - check: "test_pass_rate >= 1"
agents:
  workers: [{ profile: reliable-worker, costPerMinute: 0.2, durationMinutes: { min: 12, max: 12 } }]
  human: { delayMinutes: 2, guard: raise }
expect:
  graph: completed
  nodes: { research: done, build: done }
  events:
    include: [aim.guard_violated, graph.paused, graph.resumed, aim.updated]
  requests: { guard: 1 }
  stats: { releases: 1 }
