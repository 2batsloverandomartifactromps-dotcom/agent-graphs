name: mutations under the locked policy
description: >
  With policy.mutations locked, an attached orchestrator holding mutate cannot change the plan
  (POLICY_DENIED), but an admin can. The admin-added node is executed and the graph completes.
spec: |
  schema: agent-graphs/v1
  title: Locked mutations
  slug: mutations-locked
  policy: { mutations: locked }
  orchestrators:
    - { key: lead, name: Lead, role: lead, capabilities: [mutate, resolve] }
  aims:
    - { key: all-done, title: All nodes complete, metric: nodes_done_ratio, source: derived, comparator: gte, target: 1 }
  nodes:
    - key: build
      title: Build
      aim: Built
      purpose: The work
      prompt: Build it.
      aims: [{ check: "build_ok >= 1" }]
agents:
  workers: [{ profile: reliable-worker, durationMinutes: { min: 10, max: 10 } }]
  human: false
script:
  - at: 1
    action: mutate
    as: lead
    batch: { addNodes: [{ key: docs, title: Docs, aim: Documented, purpose: Users, prompt: Write docs., needs: [build], aims: ["Docs exist"] }] }
    expectError: POLICY_DENIED
  - at: 2
    action: mutate
    as: admin
    batch: { addNodes: [{ key: docs, title: Docs, aim: Documented, purpose: Users, prompt: Write docs., needs: [build], aims: ["Docs exist"] }] }
expect:
  graph: completed
  nodes: { build: done, docs: done }
  events:
    include: [graph.revised, node.created]
