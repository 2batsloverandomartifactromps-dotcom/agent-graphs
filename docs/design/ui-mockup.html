.btn.kill { flex: none; margin-left: 4px; height: 30px; color: var(--s-blocked-fg); border-color: color-mix(in srgb, var(--s-blocked) 35%, var(--line-2)); background: color-mix(in srgb, var(--s-blocked) 7%, var(--card)); }
.btn.kill svg { color: var(--s-blocked-fg); }
.btn.kill:hover { background: color-mix(in srgb, var(--s-blocked) 14%, var(--card)); border-color: color-mix(in srgb, var(--s-blocked) 55%, var(--line-2)); }

/* ---------- Grid ---------- */
.evo-grid { display: grid; grid-template-columns: minmax(360px, 400px) minmax(0, 1fr) minmax(236px, 264px); gap: 12px; align-items: start; }
.evo-side { display: flex; flex-direction: column; gap: 12px; min-width: 0; }

/* Lessons */
.ls-list { display: flex; flex-direction: column; }
.ls { padding: 9px 14px 10px; border-top: 1px solid var(--line); }
.ls:first-child { border-top: 0; }
.ls:hover { background: color-mix(in srgb, var(--card-2) 55%, transparent); }
.ls-h { display: flex; align-items: center; gap: 6px; min-width: 0; height: 22px; }
.ls-h .lkind { margin-top: 0; }
.ls-scope { display: inline-flex; align-items: baseline; gap: 5px; min-width: 0; font-size: var(--fs-12); color: var(--text-2); }
.ls-scope .sk { font-size: 10px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--text-3); }
.ls-act { margin-left: auto; display: inline-flex; gap: 0; flex: none; }
.ls-act .btn { color: var(--text-3); }
.ls-act .btn svg { color: var(--text-3); }
.ls-t { font-size: 12.5px; line-height: 18px; color: var(--text); margin: 4px 0 5px; text-wrap: pretty; }
.ls-m { display: flex; align-items: center; gap: 6px; min-width: 0; font-size: 11px; color: var(--text-3); white-space: nowrap; overflow: hidden; }
.ls-m .aline { flex: 0 1 auto; min-width: 0; }
.ls-m .aline .mech-t, .ls-m .aline .think + span, .ls-m .aline > span:not(.mono-tile):not(.mn):not(.think) { display: none; }
.ls-m .aline .sep { display: none; }
.prov-src { display: inline-flex; align-items: center; height: 17px; padding: 0 5px; border-radius: 4px; font-size: 10.5px; font-weight: 600; color: var(--text-2); box-shadow: inset 0 0 0 1px var(--line-2); flex: none; }
.prov-src.src-evolver { color: var(--accent-fg); background: var(--accent-bg); box-shadow: inset 0 0 0 1px var(--accent-line); }
.ls-from { flex: none; }
.ls-from .mono { font-size: 10.5px; }
.ls-from .bad { color: var(--s-failed-fg); }
.ls-from .ok { color: var(--s-done-fg); }
.ls-c { display: flex; align-items: center; gap: 6px; margin-top: 5px; font-size: 11px; color: var(--text-3); white-space: nowrap; font-variant-numeric: tabular-nums; }
.ls-c b { color: var(--text-2); font-weight: 600; }
.ls-c b.okc { color: var(--s-done-fg); }
.ls-c b.badc { color: var(--s-failed-fg); }
.ls-tag { margin-left: auto; gap: 4px; }
.ls-tag + .ls-tag { margin-left: 4px; }
.ls-tag svg { width: 11px; height: 11px; }
.ls-foot { display: flex; align-items: center; gap: 10px; padding: 7px 10px 8px; border-top: 1px solid var(--line); font-size: var(--fs-11); }
.ls-foot .btn { color: var(--accent-fg); }
.ls-foot .btn svg { color: var(--accent-fg); }
.hh2 { display: inline-flex; gap: 1px; width: 44px; height: 5px; border-radius: 3px; overflow: hidden; background: var(--card-3); flex: none; margin-right: 2px; }
.hh2 i { display: block; height: 100%; }
.hh2 i.h { background: var(--s-done); } .hh2 i.x { background: var(--s-failed); }

/* Proposal */
.prop { display: flex; flex-direction: column; overflow: hidden; }
.prop-banner { display: flex; align-items: center; gap: 7px; padding: 4px 16px; font-size: 11.5px; color: var(--text-2); background: repeating-linear-gradient(135deg, var(--accent-bg) 0 8px, transparent 8px 16px), var(--card); border-bottom: 1px dashed var(--accent-line); white-space: nowrap; overflow: hidden; }
.prop-banner > span { overflow: hidden; text-overflow: ellipsis; }
.prop-banner b { color: var(--accent-fg); font-weight: 600; }
.prop-banner svg { color: var(--accent-fg); flex: none; }
.prop-h { display: flex; align-items: flex-start; gap: 16px; padding: 10px 16px 8px; }
.prop-t { font-size: 14.5px; line-height: 20px; font-weight: 600; letter-spacing: -.01em; text-wrap: pretty; }
.prop-t .mono { font-size: 13px; color: var(--accent-fg); }
.prop-m { display: flex; align-items: center; gap: 6px; min-width: 0; white-space: nowrap; overflow: hidden; }
.prop-m .aline { min-width: 0; }
.prop-m .aline .mech-t, .prop-m .aline .think + span, .prop-m .aline > span:not(.mono-tile):not(.mn):not(.think), .prop-m .aline .sep { display: none; }
.prop-act { display: flex; gap: 6px; flex: none; }
.ladder { display: flex; gap: 6px; padding: 0 16px 8px; }
.lstep { position: relative; min-width: 0; flex: 1 1 auto; padding: 5px 8px 5px; border-radius: var(--r-md); border: 1px solid var(--line); background: color-mix(in srgb, var(--c) 6%, var(--card)); }
.lstep:not(:last-child)::after { content: ""; position: absolute; right: -6px; top: 50%; width: 6px; height: 1px; background: var(--line-3); }
.lstep.st-done { border-color: color-mix(in srgb, var(--c) 30%, var(--line)); }
.lstep.st-needs_input { border-color: color-mix(in srgb, var(--c) 45%, var(--line)); background: color-mix(in srgb, var(--c) 10%, var(--card)); }
.lstep.off { border-style: dashed; background: transparent; }
.lpill { display: flex; align-items: center; gap: 5px; font-size: var(--fs-12); font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; }
.lpill svg { width: 13px; height: 13px; color: var(--c); flex: none; }
.lpill .ln { font-size: 10.5px; color: var(--text-3); font-weight: 600; font-variant-numeric: tabular-nums; }
.lstep.off .lpill { color: var(--text-3); }
.lv { font-size: 11px; color: var(--text-3); margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lv b { color: var(--s-done-fg); font-weight: 600; }
.lstep.st-needs_input .lv { color: var(--c-fg); }
.gate-rule { display: flex; align-items: center; gap: 8px; margin: 0 16px 8px; padding: 0 10px; height: 30px; border-radius: var(--r-md); font-size: var(--fs-12); color: var(--text-2); white-space: nowrap; overflow: hidden; background: color-mix(in srgb, var(--s-done) 6%, var(--card)); border: 1px solid color-mix(in srgb, var(--s-done) 22%, var(--line)); }
.gate-rule > svg { color: var(--s-done-fg); }
.gate-rule b { color: var(--text); font-weight: 600; }
.gr-v { display: inline-flex; align-items: center; gap: 4px; font-family: var(--font-mono); font-variant-ligatures: none; font-size: 11.5px; color: var(--s-done-fg); font-weight: 600; }
.gr-v svg { color: var(--s-done-fg); }
.gr-wait { margin-left: auto; display: inline-flex; align-items: center; gap: 5px; color: var(--s-needs-fg); font-weight: 500; }
.gr-wait svg { color: var(--s-needs); }
.prop-body { display: flex; flex-direction: column; gap: 8px; padding: 0 16px 10px; min-width: 0; }
.diff { border: 1px solid var(--line); border-radius: var(--r-md); background: var(--bg); overflow: hidden; }
:root[data-theme="light"] .diff { background: #fafafb; }
.diff { padding: 4px 0; }
.dl { font: 11px/16px var(--font-mono); font-variant-ligatures: none; color: var(--text-2); white-space: pre; overflow: hidden; text-overflow: ellipsis; padding: 0 10px; }
.dl.hunk { color: var(--accent-fg); background: color-mix(in srgb, var(--accent) 7%, transparent); }
.dl.hunk + .dl, .dl + .dl.hunk { }
.dl:not(:first-child).hunk { margin-top: 4px; }
.dl.add { color: var(--s-done-fg); background: color-mix(in srgb, var(--s-done) 9%, transparent); box-shadow: inset 2px 0 0 var(--s-done); }
.dl.del { color: var(--s-failed-fg); background: color-mix(in srgb, var(--s-failed) 9%, transparent); box-shadow: inset 2px 0 0 var(--s-failed); }
.traces { min-width: 0; }
.tr-cap { display: flex; align-items: baseline; gap: 8px; font-size: var(--fs-12); font-weight: 600; color: var(--text); margin-bottom: 6px; }
.tr-cap .muted { font-weight: 400; font-size: var(--fs-11); }
.tr-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 8px; }
.trace { border: 1px solid var(--line); border-radius: var(--r-md); padding: 8px 10px; min-width: 0; position: relative; overflow: hidden; }
.trace::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--tc); }
.trace.hi { --tc: var(--s-done); --tf: var(--s-done-fg); }
.trace.lo { --tc: var(--s-failed); --tf: var(--s-failed-fg); }
.tr-h { display: flex; align-items: center; gap: 8px; min-width: 0; }
.tr-score { font: 600 12px/1 var(--font-mono); font-variant-ligatures: none; color: var(--tf); padding: 5px 6px; border-radius: 6px; background: color-mix(in srgb, var(--tc) 13%, transparent); flex: none; }
.tr-t { font-size: var(--fs-12); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tr-s { font-size: var(--fs-11); color: var(--text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tr-steps { display: flex; flex-direction: column; gap: 1px; margin: 6px 0 5px; }
.tr-steps > div { display: flex; align-items: center; gap: 6px; height: 19px; padding: 0 4px; border-radius: 5px; font-size: 11.5px; color: var(--text-2); min-width: 0; }
.tr-steps > div .sicon svg { width: 12px; height: 12px; }
.tr-steps > div.dstep { background: var(--accent-bg); color: var(--text); }
.tr-steps > div.dstep .tag { margin-left: auto; height: 16px; font-size: 10px; }
.tr-f .aline { font-size: 10.5px; }
.tr-f .aline .mech-t, .tr-f .aline .think + span, .tr-f .aline > span:not(.mono-tile):not(.mn):not(.think), .tr-f .aline .sep { display: none; }
.prop-f { margin-top: auto; display: flex; align-items: center; gap: 12px; padding: 7px 16px; border-top: 1px solid var(--line); background: color-mix(in srgb, var(--card-2) 40%, var(--card)); }
.prop-f .input { flex: 1 1 auto; height: 30px; background: var(--bg); min-width: 0; }
:root[data-theme="light"] .prop-f .input { background: #fff; }
.prop-f .hint { font-size: var(--fs-11); color: var(--text-3); white-space: nowrap; flex: none; }

/* Rejection memory */
.rj { display: flex; gap: 10px; padding: 10px 14px; border-top: 1px solid var(--line); align-items: flex-start; }
.card-h + .rj { border-top: 0; }
.rj-i { width: 24px; height: 24px; border-radius: var(--r-sm); display: grid; place-items: center; flex: none; color: var(--c-fg); background: color-mix(in srgb, var(--c) 13%, transparent); }
.rj-i svg { width: 13px; height: 13px; }
.rj-t { font-size: 12.5px; color: var(--text); font-weight: 500; text-decoration: line-through; text-decoration-color: var(--text-3); text-decoration-thickness: 1px; }
.rj-w { font-size: var(--fs-11); color: var(--c-fg, var(--text-2)); }
.rj-when { font-size: var(--fs-11); color: var(--text-3); }

/* Lineage (E3 — ghosted) */
.lin-wrap { position: relative; padding: 10px 14px 12px; }
svg.lin { display: block; width: 100%; height: auto; opacity: .42; filter: saturate(.6); }
svg.lin .lv rect { fill: var(--card-2); stroke: var(--line-3); stroke-width: 1; }
svg.lin .lv text { font: 600 10.5px var(--font-sans); fill: var(--text-2); text-anchor: middle; }
svg.lin .lv text.sc { font: 500 10px var(--font-mono); fill: var(--text-3); }
svg.lin .lv.rej rect { stroke: var(--s-failed); stroke-dasharray: 3 2; }
svg.lin .lv.cand rect { stroke: var(--accent); stroke-dasharray: 3 2; }
.lin-over { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: var(--r-pill); font-size: var(--fs-11); font-weight: 500; color: var(--text-2); background: var(--card); border: 1px solid var(--line-2); box-shadow: var(--shadow-md); white-space: nowrap; }
.lin-over svg { color: var(--text-3); }

/* Budget */
.eb { padding: 10px 14px 12px; font-size: var(--fs-12); }
.eb-r { display: flex; justify-content: space-between; gap: 8px; white-space: nowrap; }
.eb-r b { font-weight: 600; }
.eb .meter { margin: 6px 0 10px; }
.eb .meter:last-child { margin-bottom: 0; }

/* Overview: tiny link to the Evolution tab on graphs with evolution enabled */
.evo-chip { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: var(--r-pill); font-size: 11px; font-weight: 600; color: var(--accent-fg); background: var(--accent-bg); box-shadow: inset 0 0 0 1px var(--accent-line); white-space: nowrap; flex: none; }
.evo-chip svg { width: 12px; height: 12px; }
.evo-chip:hover { background: color-mix(in srgb, var(--accent) 22%, transparent); }

/* Design-system sheet: evolution group */
.sys-evo { display: flex; flex-wrap: wrap; gap: 16px 32px; }
.sys-evo .g { display: flex; flex-direction: column; gap: 8px; }
.sys-evo .eyebrow { font-size: 10.5px; }
.sys-pk { overflow: visible; }
.sys-pk .e-req { fill: none; }
.sys-ls { flex: none; padding: 3px 8px; }

/* Narrower viewports: the side column moves below so the proposal keeps its width */
@media (max-width: 1380px) {
  .evo-grid { grid-template-columns: minmax(340px, 380px) minmax(0, 1fr); }
  .evo-side { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); align-items: start; }
  .eh-sub { display: none; }
}
.evo-col .card-h .sub { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }

</style>

      const msAfter = (r.ms || []).some(m => Math.abs(m.at - b.b) < 3) ? 12 : 0;
      const outside = !fits && b.l && room > b.l.length * 6 + 12 ? `<span class="bar-out" style="left:${px(b.b) + 6 + msAfter}px">${b.l}</span>` : '';
      return `<div class="${barCls(b)}" style="left:${px(b.a)}px;width:${w}px" title="${r.key}: ${b.l || b.st}">${b.st !== 'ghost' && w > 20 ? ic(barIcon(b)) : ''}${fits ? `<span class="ellipsis">${b.l}</span>` : ''}</div>${outside}`;
    }).join('');
    const ms = (r.ms || []).map(m => `<span class="ms-dia st-${m.st}" style="left:${px(m.at) - 7}px" title="${m.st}"></span>`).join('');
    return `<div class="g-row${r.key === selected ? ' sel' : ''}" data-key="${r.key}"><div class="nm">${sicon(r.st)}<span class="k">${r.key}</span><span class="kd">${n.kind === 'task' ? '' : n.kind}</span></div><div class="lane">${grid}${bars}${ms}</div></div>`;
  }).join('');
  const ia = TIMELINE.findIndex(r => r.key === 'implement-api');
  const iters = TIMELINE[ia].iters.map(it => `<div class="iter-bracket" style="left:${LBL + px(it.a)}px;width:${px(it.b) - px(it.a)}px;top:${32 + ia * RH + 3}px;height:${RH * 2 - 6}px"><span>${ic('loop', 'xs')} ${it.l}</span></div>`).join('');
  g.innerHTML = `<div class="g-axis"><div class="lab">Node</div><div class="ticks">${ticks.filter(m => m < SPAN).map(m => `<span class="tick" style="left:${px(m)}px">${clock(m)}</span>`).join('')}</div></div>${rows}${iters}
    <div class="now-line" style="left:${LBL + px(TL_NOW)}px"><span>now 16:42</span></div>`;
  $$('#gantt .g-row').forEach(r => r.onclick = () => selectNode(r.dataset.key));
}

/* ==========================================================================

   ========================================================================== */
const NAV_GRAPHS = [['Notes app — MVP build', 'running', true], ['Billing service migration', 'running'], ['Docs site redesign', 'running'], ['Onboarding emails', 'paused'], ['Search reindex', 'done']];
let sideOverride = null; let graphReady = false;

function setTheme(t, persist) {
  document.documentElement.dataset.theme = t;
  if (persist) { try { localStorage.setItem('ag-theme', t); } catch (e) {} }
}
function initTheme() {
  const q = new URLSearchParams(location.search).get('theme');
  let t = q;
  if (!t) { try { t = localStorage.getItem('ag-theme'); } catch (e) {} }
  setTheme(t === 'light' ? 'light' : 'dark');
  $('#theme-toggle').onclick = () => { setTheme(document.documentElement.dataset.theme === 'light' ? 'dark' : 'light', true); if (graphReady) { renderEdges(); renderMinimap(); applyView(); } if (parseRoute().view === 'system') renderSystem(); };
}
function parseRoute() {
  const h = location.hash.replace(/^#\/?/, '') || 'overview';
  const [path, qs] = h.split('?');
  const parts = path.split('/');
  return { view: parts[0] || 'overview', sub: parts[1] || 'canvas', q: new URLSearchParams(qs || '') };
}
function route() {
  const r = parseRoute();
  const viewId = ['overview', 'graph', 'inbox', 'system'].includes(r.view) ? r.view : 'overview';
  $$('.view').forEach(v => v.classList.toggle('on', v.id === 'view-' + viewId));
  $$('#nav > a').forEach(a => a.classList.toggle('active', a.dataset.route === viewId));
  const rail = sideOverride ?? (viewId === 'graph');
  $('#app').classList.toggle('rail', rail);
  const crumbs = {
    overview: `<span>Acme</span>${ic('chevR')}<span class="cur">Overview</span>`,
    inbox: `<span>Acme</span>${ic('chevR')}<span class="cur">Inbox</span>`,
    system: `<span>Settings</span>${ic('chevR')}<span class="cur">Design system</span>`,
    graph: `<a href="#/overview">Graphs</a>${ic('chevR')}<span class="cur">${GRAPH.title}</span>${ic('chevR')}<span>${(GTABS.find(t => t[0] === r.sub) || GTABS[0])[1]}</span>`,
  };
  $('#crumbs').innerHTML = crumbs[viewId];
  if (viewId === 'system') renderSystem();
  if (viewId === 'graph') {
    if (!graphReady) {
      renderGraphHeader(); setupCanvas(); graphReady = true;
      if (r.q.get('node')) selected = r.q.get('node');
      renderInspector(selected, r.q.get('tab') || 'overview');
      $$('#world .node').forEach(el => el.classList.toggle('sel', el.dataset.key === selected));
      requestAnimationFrame(() => { fitTo(HERO, { includeLoop: true }); });
    } else if (r.q.get('node') || r.q.get('tab')) {
      selectNode(r.q.get('node') || selected, r.q.get('tab') || insTab);
    }
    renderGraphTabs(r.sub);
    const OWN = ['canvas', 'timeline', 'evolution'];
    $('#sub-canvas').classList.toggle('on', r.sub === 'canvas');
    $('#sub-timeline').classList.toggle('on', r.sub === 'timeline');
    $('#sub-evolution').classList.toggle('on', r.sub === 'evolution');
    $('#sub-other').classList.toggle('on', !OWN.includes(r.sub));
    $('.gw-body').classList.toggle('wide', r.sub === 'evolution');   // graph-level view: no node inspector
    if (r.sub === 'timeline') renderTimeline();
    if (r.sub === 'evolution') renderEvolution();
    if (!OWN.includes(r.sub)) {
      const t = GTABS.find(x => x[0] === r.sub) || GTABS[2];
      $('#sub-other').innerHTML = `<div class="empty-sub"><div class="box">${ic(t[2])}<h4>${t[1]}</h4><div>This tab is out of scope for the mockup — Canvas, Timeline and Evolution carry the visual language.</div></div></div>`;
    }
    $$('#graph-tabs [data-gtab]').forEach(b => b.onclick = () => { location.hash = '#/graph' + (b.dataset.gtab === 'canvas' ? '' : '/' + b.dataset.gtab); });
    if (r.sub === 'canvas') requestAnimationFrame(() => { applyView(); if (r.q.get('pk')) openPk(r.q.get('pk'), true); });
  }
}
function initTooltips() {
  const tip = $('#tip');
  document.addEventListener('pointerover', (e) => {
    const el = e.target.closest('[data-tip]'); if (!el) { tip.classList.remove('on'); return; }
    tip.textContent = el.dataset.tip; const r = el.getBoundingClientRect();
    tip.style.left = Math.min(window.innerWidth - 270, r.left + r.width / 2 - 40) + 'px'; tip.style.top = (r.top - 34) + 'px'; tip.classList.add('on');
  });
}
function liveTicks() {
  // Subtle live updates: heartbeat refresh + a progress nudge with a gentle highlight
  let hb = 40, pc = 64;
  setInterval(() => {
    hb = hb >= 55 ? 2 : hb + 5;
    const v = $$('#inspector .lb-meta .v')[1]; if (v) { v.textContent = hb < 5 ? 'just now' : hb + 's ago'; if (hb < 5) { v.classList.remove('flash'); void v.offsetWidth; v.classList.add('flash'); } }
  }, 5000);
  setInterval(() => {
    if (pc >= 71) return; pc += 1; const n = byKey['implement-api']; n.progress = pc;
    const card = $('#world .node[data-key="implement-api"]'); if (!card) return;
    card.querySelector('.n-prog .pc').textContent = pc + '%'; card.querySelector('.n-prog .meter i').style.width = pc + '%';
    const lb = $('#inspector .livebox'); if (lb && selected === 'implement-api') { lb.querySelector('.pc').textContent = pc + '%'; lb.querySelector('.meter i').style.width = pc + '%'; }
  }, 9000);
}
function init() {
  hydrateIcons();
  initTheme();
  $('#nav-graphs').innerHTML = NAV_GRAPHS.map(([t, st, cur]) => `<a href="#/graph" class="${cur ? '' : ''}" title="${t}"><span class="dot st-${st}"></span><span class="ellipsis">${t}</span></a>`).join('');
  $('#toggle-side').onclick = () => { sideOverride = !$('#app').classList.contains('rail'); route(); };
  renderOverview(); renderInbox();
  window.addEventListener('hashchange', route);
  route(); initTooltips(); liveTicks();
}
document.addEventListener('DOMContentLoaded', init);

</script>
</body>
