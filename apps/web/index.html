<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <title>Agent Graphs</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%235b5cf0'/%3E%3Cg fill='none' stroke='white' stroke-width='2'%3E%3Ccircle cx='6.5' cy='7' r='2'/%3E%3Ccircle cx='6.5' cy='17' r='2'/%3E%3Ccircle cx='17.5' cy='12' r='2'/%3E%3Cpath d='M8.5 7.5c3 .6 4.2 2 7 3.8M8.5 16.5c3-.6 4.2-2 7-3.8'/%3E%3C/g%3E%3C/svg%3E"
    />
    <script>
      // Apply the saved theme before first paint (no flash).
      (() => {
        let theme = 'dark';
        try {
          const saved = JSON.parse(localStorage.getItem('agent-graphs.settings') || '{}');
          theme = saved.state?.theme || 'dark';
          if (theme === 'system')
            theme = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        } catch {
          theme = 'dark';
        }
        document.documentElement.dataset.theme = theme;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
